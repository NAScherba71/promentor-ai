name: Repo Health Check

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}

jobs:
  check-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository branches via API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch branches (up to 100)
            // Note: For repos with >100 branches, not all will be checked
            const branchesResp = await github.rest.repos.listBranches({
              owner, repo, per_page: 100
            });
            const branchNames = branchesResp.data.map(b => b.name);
            console.log(`Found branches: ${branchNames.join(', ')}`);

            // If more than the default branch exists, create an issue (once)
            if (branchNames.length > 1) {
              const title = 'Repo health: additional branches detected';
              const openIssues = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100
              });
              const already = openIssues.data.some(
                i => i.title === title
              );
              if (!already) {
                const howTo = [
                  '## How to Fix',
                  '',
                  'To clean up stale branches that have been merged:',
                  '1. Go to Actions tab',
                  '2. Select "Cleanup Stale Branches" workflow',
                  '3. Click "Run workflow"',
                  '',
                  'This will automatically delete merged branches.'
                ].join('\n');
                const body = [
                  `Detected branches: ${branchNames.join(', ')}`,
                  '',
                  'This issue was created by repo-health workflow.',
                  '',
                  howTo
                ].join('\n');
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body
                });
              } else {
                console.log(
                  'Open issue about additional branches exists.'
                );
              }
            } else {
              console.log(
                'Only the default branch is present. No action required.'
              );
            }
